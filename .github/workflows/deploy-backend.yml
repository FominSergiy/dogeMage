name: deploy backend to GCP 📚

on:
  push:
    branches: [main, master]
    paths:
      - "functions/**"
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -var="project_id=${{ vars.GCP_PROJECT_ID }}"

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -var="project_id=${{ vars.GCP_PROJECT_ID }}"

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: infra
        run: |
          echo "get_scores_url=$(terraform output -raw get_scores_url)" >> "$GITHUB_OUTPUT"
          echo "post_score_url=$(terraform output -raw post_score_url)" >> "$GITHUB_OUTPUT"

      - name: Update GitHub Variables with function URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set VITE_SCOREBOARD_RESULTS_ENDPOINT \
            --body "${{ steps.tf_outputs.outputs.get_scores_url }}" \
            --repo "${{ github.repository }}"
          gh variable set VITE_POST_NEW_SCORE_ENDPOINT \
            --body "${{ steps.tf_outputs.outputs.post_score_url }}" \
            --repo "${{ github.repository }}"
